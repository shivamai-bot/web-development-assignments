<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Marks</title>
    <style>
        table { border-collapse: collapse; width: 75%; text-align: center; }
        th, td { border: 1px solid black; padding: 8px; }
        .group { color: #008f55; }
        .subhead { color: red; font-weight: normal; }
        td { color: #078bd1; }
    </style>
</head>
<body>
    <h2>Student Semester Marks</h2>
    <table>
        <tr>
            <th class="group" colspan="2">Student Details</th>
            <th class="group" colspan="2">Semester I</th>
            <th class="group" colspan="2">Semester II</th>
        </tr>
        <tr>
            <th class="subhead">Roll No.</th><th class="subhead">Name</th>
            <th class="subhead">Theory</th><th class="subhead">Practical</th>
            <th class="subhead">Theory</th><th class="subhead">Practical</th>
        </tr>
        <tr><td>101</td><td>Amit</td><td>78</td><td>85</td><td>82</td><td>88</td></tr>
        <tr><td>102</td><td>Neha</td><td>89</td><td>92</td><td>91</td><td>94</td></tr>
    </table>
</body>
</html>
