<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested Table Example</title>
    <style>
        table { border: 1px solid #333; border-collapse: collapse; }
        th, td { border: 1px solid #555; padding: 8px; }
        .inner { background-color: #f3f6fa; width: 100%; }
    </style>
</head>
<body>
    <h2>Nested Tables</h2>
    <table>
        <tr>
            <th>Header 1</th><th>Header 2</th><th>Header 3</th><th>Header 4</th>
        </tr>
        <tr>
            <td>Row 2 - Item 1</td>
            <td>Row 2 - Item 2</td>
            <td rowspan="2">
                <b>Nested Table 1</b>
                <table class="inner">
                    <tr><th>Row</th><th>Item</th></tr>
                    <tr><td>1</td><td>A</td></tr>
                    <tr><td>2</td><td>B</td></tr>
                </table>
            </td>
            <td>Row 2 - Item 4</td>
        </tr>
        <tr>
            <td colspan="2">
                <b>Nested Table 2</b>
                <table class="inner">
                    <tr><th>Header</th><th>Value</th></tr>
                    <tr><td>Row 1</td><td>Item</td></tr>
                    <tr><td>Row 2</td><td>Item</td></tr>
                </table>
            </td>
            <td>Row 3 - Item 4</td>
        </tr>
        <tr>
            <td>Row 4 - Item 1</td><td>Row 4 - Item 2</td>
            <td>Row 4 - Item 3</td><td>Row 4 - Item 4</td>
        </tr>
        <tr><td colspan="4">Last row of the outer table</td></tr>
    </table>
</body>
</html>
