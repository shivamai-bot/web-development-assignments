<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image in Table Cell</title>
    <style>
        table { border-collapse: collapse; width: 60%; }
        th, td { border: 1px solid black; padding: 10px; text-align: center; }
        th { background-color: #e8eef5; }
        img { width: 90px; height: 90px; object-fit: cover; }
    </style>
</head>
<body>
    <h2>Student Details with Photograph</h2>
    <table>
        <tr><th>Photo</th><th>Student Name</th><th>Course</th></tr>
        <tr>
            <td><img src="https://cdnai.iconscout.com/ai-image/premium/thumb/ai-boy-showing-thumbs-up-3d-illustration-png-download-jpg-13227890.png" alt="Student photograph"></td>
            <td>Anish Shinde</td><td>MCA</td>
        </tr>
    </table>
</body>
</html>
