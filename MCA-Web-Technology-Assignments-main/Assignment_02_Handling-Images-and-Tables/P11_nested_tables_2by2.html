<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nested Table Layout</title>
    <style>
        table { border-collapse: collapse; }
        .outer { width: 65%; border: 3px double #333; }
        .outer td { border: 2px solid #555; padding: 15px; text-align: center; }
        .inner { width: 100%; border: 2px solid blue; }
        .inner td { border: 2px solid blue; padding: 12px; }
    </style>
</head>
<body>
    <h2>Outer Table with an Inner Table</h2>
    <table class="outer">
        <tr>
            <td rowspan="2">Table 1</td>
            <td>
                Table 1
                <table class="inner">
                    <tr><td>Table 2</td><td>Table 2</td></tr>
                    <tr><td>Table 2</td><td>Table 2</td></tr>
                </table>
            </td>
        </tr>
        <tr><td>Table 1</td></tr>
    </table>
</body>
</html>
