<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlink in Table Cell</title>
    <style>
        table { border-collapse: collapse; width: 60%; }
        th, td { border: 1px solid black; padding: 10px; }
        th { background-color: #e8eef5; }
    </style>
</head>
<body>
    <h2>Useful Websites</h2>
    <table>
        <tr><th>Website</th><th>Link</th></tr>
        <tr>
            <td>Google</td>
            <td><a href="https://www.google.com" target="_blank">Open Google</a></td>
        </tr>
        <tr>
            <td>W3Schools</td>
            <td><a href="https://www.w3schools.com" target="_blank">Learn HTML</a></td>
        </tr>
        <tr>
            <td>MDN</td>
            <td><a href="https://developer.mozilla.org" target="_blank">Visit MDN</a></td>
        </tr>
    </table>
</body>
</html>
