<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>This is a simple form</h1>
    <form action="Table tag.html">
        <label for="name">Name
            <input type="text" name="Myname" id="name">
        </label><br>
        <div>
            Department <input type="text" name="Mydepartment">
        </div><br>
        <div>
            Email <input type="email" name="Myemail">
        </div><br>
        <div>
            Date <input type="date" name="Mydate">
        </div><br>
        <div>
            Number <input type="number" name="Mynumber">
        </div><br>
        <label for="Are you eligible">Are you eligible</label>
        <div>
            <input type="checkbox" name="Myeligibility" id="Are you eligible">
        </div><br>
        <div>
            Gender
            Male <input type="radio" name="Mygender"> Female <input type="radio" name="Mygender">
        </div><br>
        <textarea name="Mytextarea" cols="50" rows="10"></textarea><br>
        <label for="car">car</label>
        <select name="Mycar" id="car">
            <option value="Alto">Alto</option>
            <option value="BMW">BMW</option>
            <option value="Audi">AUDI</option>
            <option value="Swift">SWIFT</option>
        </select><br>
        <div>
            <input type="reset" name="Reset Now">
            <input type="submit" value="submit">
        </div>
    </form>
</body>
</html>
