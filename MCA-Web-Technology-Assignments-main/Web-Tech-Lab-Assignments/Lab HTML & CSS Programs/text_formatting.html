<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <!-- Bold font tag -->
    <b>Hello World</b><br>
    <!-- italic tag  -->
     <i>Hello World</i><br>
     <!-- Underline tag -->
     <u>Hello World</u>
     <!-- Superscript -->
      <p>This is normal text and <sup> this is superscript</sup></p>
      <!-- Subscript -->
       <p>This is normal text and <sub>this is subscript.</sub></p>
       <!-- Types of Quotation
            1. Short line quotation: <q>
            2. Block Quotation: <blockquote>
            3. Citations: <cite>
            4. Address for Contact Information: <address>-->
                <!-- Short Line quotation: <q> -->
                    <p>This is short line quotation : <q>hello world</q></p>
                <!-- Block quotation: <blockquote> -->
                    <blockquote cite="https://www.google.com/?zx=1786337653282">Google</blockquote>
                <!-- Citations: <cite> -->
                    <p><cite>Hello World</cite>, said Computer</p>
                <!-- Address for Contact Information: <address> -->
                    <address>Written by Tony <br>
                    Visit Us
                    </address>
        
            <!-- Code Tag The <code> tag is typically used to display inline code snippets.
                 For multiple lines of code, it is recommended to wrap the <code> element within a <pre> element. -->
             <p>The HTML <code>button</code> tag defines a clickable button.</p>
</body>
</html>
