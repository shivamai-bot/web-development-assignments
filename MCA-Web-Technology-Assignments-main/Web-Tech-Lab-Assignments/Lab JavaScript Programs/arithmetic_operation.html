<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operation</title>
</head>
<body>
    <script>
        var x = 10;
        var y = 2;
        add = x + y;
        sub = x - y;
        mul = x * y;
        div = x / y;
        mod = x % y;
        document.writeln("Addition: "+add);
        document.writeln("Subtraction: "+sub);
        document.writeln("Multiplication: "+mul);
        document.writeln("Division: "+div);
        document.writeln("Modulus Division: "+mod);
    </script>
</body>
</html>
