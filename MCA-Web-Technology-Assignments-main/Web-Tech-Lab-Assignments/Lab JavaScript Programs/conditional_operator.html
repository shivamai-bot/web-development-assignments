<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Operator</title>
</head>
<body>
    <script>
        var x = 10;
        var y = 2;
        if (x >= y) {
            document.writeln("X is Greater")
        } else {
            document.writeln("Y is Greater")
        }
        if (x <= y) {
            document.writeln("Y is Greater")
        } else {
            document.writeln("X is Greater")
        }
        if (x != y) {
            document.writeln("X is Not equal to Y")
        } else {
            document.writeln("X is equal to Y")
        }
    </script>
</body>
</html>
