<!DOCTYPE html> 
<html> 
<head><title>Current Date and Time</title></head> 
<body> 
    <h2>Display Current Date and Time</h2> 
    <button onclick="showDateTime()">Show Date and Time</button> 
    <script> 
        function showDateTime() { 
            const current = new Date(); 
            alert("Current Date and Time: " + current.toLocaleString()); 
        } 
    </script> 
</body> 
</html>
