<!DOCTYPE html> 
<html> 
<head><title>Prime Numbers</title></head> 
<body> 
    <h2>Prime Numbers Between 1 and 100</h2> 
    <p id="output"></p> 
    <script> 
        let primes = []; 
        for (let num = 2; num <= 100; num++) { 
            let isPrime = true; 
            for (let i = 2; i <= Math.sqrt(num); i++) { 
                if (num % i === 0) { 
                    isPrime = false; 
                    break; 
                } 
            } 
            if (isPrime) primes.push(num); 
        } 
        document.getElementById("output").textContent = primes.join(", "); 
    </script> 
</body> 
</html>
