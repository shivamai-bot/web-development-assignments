<!DOCTYPE html> 
<html> 
<head> 
    <title>Hospital Registration</title> 
</head> 
<body> 
    <h2>Hospital Patient Registration</h2> 
    <form id="hospitalForm"> 
        Patient Name: <input type="text" id="patientName"><br><br> 
        Age: <input type="number" id="age" min="1" max="120"><br><br> 
        Gender: 
        <select id="gender"> 
            <option value="">Select Gender</option> 
            <option>Male</option> 
            <option>Female</option> 
            <option>Other</option> 
        </select><br><br> 
        Mobile Number: <input type="text" id="mobile"><br><br> 
        Visit Date: <input type="date" id="visitDate"><br><br> 
        Symptoms: <textarea id="symptoms"></textarea><br><br> 
        <button type="submit">Register Patient</button> 
    </form> 
    <p id="message"></p> 
  
    <script> 
        document.getElementById("hospitalForm").addEventListener("submit", function (e) { 
            e.preventDefault(); 
            const name = document.getElementById("patientName").value.trim(); 
            const age = Number(document.getElementById("age").value); 
            const gender = document.getElementById("gender").value; 
            const mobile = document.getElementById("mobile").value.trim(); 
            const date = document.getElementById("visitDate").value; 
  
            if (!name || !age || !gender || !mobile || !date) { 
                document.getElementById("message").textContent = 
                    "Please complete all required fields."; 
            } else if (!/^\d{10}$/.test(mobile)) { 
                document.getElementById("message").textContent = 
                    "Enter a valid 10-digit mobile number."; 
            } else { 
                document.getElementById("message").textContent = 
                    "Patient registered successfully for " + name + "."; 
            } 
        }); 
    </script> 
</body> 
</html>
