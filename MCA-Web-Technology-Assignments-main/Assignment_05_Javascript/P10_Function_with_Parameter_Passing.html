<!DOCTYPE html> 
<html> 
<head><title>Functions with Parameters</title></head> 
<body> 
    <h2>Function with Parameter Passing</h2> 
    <p id="output"></p> 
    <script> 
        function addNumbers(a, b) { 
            return a + b; 
        } 
        const result = addNumbers(10, 20); 
        document.getElementById("output").textContent = 
            "The sum of 10 and 20 is " + result; 
    </script> 
</body> 
</html>
