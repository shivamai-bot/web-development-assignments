<!-- Advanced Questions | Q8. Create a small bouncing ball animation using <canvas> and JavaScript. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bouncing Ball</title>
</head>
<body>
  <canvas id="game" width="500" height="300" style="border:2px solid black;"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let x = 100, y = 100;     // ball position
    let dx = 3,  dy = 2;      // speed in x and y
    const radius = 20;

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw the ball
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, 2 * Math.PI);
      ctx.fillStyle = "tomato";
      ctx.fill();

      // Bounce off the walls
      if (x + radius > canvas.width || x - radius < 0) dx = -dx;
      if (y + radius > canvas.height || y - radius < 0) dy = -dy;

      // Move the ball
      x += dx;
      y += dy;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
