<!-- Basic Questions | Q15. Write HTML to show two images with their captions using <figure> and <figcaption>. -->
<figure>
  <img src="beach.jpg" alt="Beach" width="250">
  <figcaption>A quiet beach at sunset.</figcaption>
</figure>

<figure>
  <img src="forest.jpg" alt="Forest" width="250">
  <figcaption>A green forest after rain.</figcaption>
</figure>
