<!-- Basic Questions | Q11. Create a webpage with <header>, <main>, and <footer> layout. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Layout</title>
</head>
<body>
  <header>
    <h1>My Website</h1>
  </header>

  <main>
    <h2>Main Content</h2>
    <p>This is the central content of the page.</p>
  </main>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>
</body>
</html>
