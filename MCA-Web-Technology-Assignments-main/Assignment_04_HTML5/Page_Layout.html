<!-- Intermediate Questions | Q1. Create a webpage layout with <header>, <nav>, <main>, <aside>, and <footer>. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Layout</title>
  <style>
    body   { font-family: Arial, sans-serif; margin: 0; }
    header, footer { background: #2c3e50; color: white; padding: 15px; text-align: center; }
    nav    { background: #ecf0f1; padding: 10px; }
    nav a  { margin-right: 15px; text-decoration: none; }
    .wrapper { display: flex; }
    main   { flex: 3; padding: 15px; }
    aside  { flex: 1; background: #f7f7f7; padding: 15px; }
  </style>
</head>
<body>
  <header><h1>My Website</h1></header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <div class="wrapper">
    <main>
      <h2>Welcome</h2>
      <p>This is the main content area.</p>
    </main>
    <aside>
      <h3>Sidebar</h3>
      <p>Extra information goes here.</p>
    </aside>
  </div>

  <footer><p>&copy; 2026 My Website</p></footer>
</body>
</html>
