<!-- Basic Questions | Q14. Create a simple blog page with one <article> inside <main>. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Blog</title>
</head>
<body>
  <header><h1>My Blog</h1></header>

  <main>
    <article>
      <h2>Why I Love Web Development</h2>
      <p>Building things that anyone in the world can open in a browser is exciting.</p>
    </article>
  </main>

  <footer><p>&copy; 2026 My Blog</p></footer>
</body>
</html>
