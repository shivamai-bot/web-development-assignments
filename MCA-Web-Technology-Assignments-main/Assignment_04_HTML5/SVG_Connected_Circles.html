<!-- Intermediate Questions | Q14. Create an inline SVG with a line connecting two circles. -->
<svg width="300" height="150">
  <line x1="50" y1="75" x2="250" y2="75" stroke="black" stroke-width="3" />
  <circle cx="50"  cy="75" r="25" fill="skyblue" stroke="black" />
  <circle cx="250" cy="75" r="25" fill="salmon"  stroke="black" />
</svg>
