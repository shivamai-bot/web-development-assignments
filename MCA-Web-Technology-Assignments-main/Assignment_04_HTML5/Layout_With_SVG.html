<!-- Intermediate Questions | Q20. Write HTML with a <header>, <main>, <aside>, and <footer> plus an inline SVG below the main content. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout with SVG</title>
</head>
<body>
  <header><h1>Shapes Gallery</h1></header>

  <main>
    <p>Below this text you will find an inline SVG drawing.</p>

    <svg width="300" height="120">
      <rect x="10" y="10" width="100" height="100" fill="teal" />
      <circle cx="200" cy="60" r="45" fill="coral" />
    </svg>
  </main>

  <aside>
    <h3>About</h3>
    <p>SVG graphics scale without losing quality.</p>
  </aside>

  <footer><p>&copy; 2026 Shapes Gallery</p></footer>
</body>
</html>
