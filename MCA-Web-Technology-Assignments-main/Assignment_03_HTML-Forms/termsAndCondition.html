<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms And Condition</title>
</head>

<body>
    <form>
        <label><input type="checkbox" id="terms"> I agree to the terms and conditions</label>
        <button type="submit" id="termsSubmit" disabled>Submit</button>
    </form>
    <script>
        const terms = document.getElementById("terms");
        const submit = document.getElementById("termsSubmit");
        terms.addEventListener("change", () => {
            submit.disabled = !terms.checked;
        });
    </script>

</body>

</html>
