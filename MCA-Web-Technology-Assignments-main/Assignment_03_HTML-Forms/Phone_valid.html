<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Validation</title>
</head>
<body>
    <form>
  <label for="tenDigitPhone">Phone (10 digits):</label>
  <input type="tel" id="tenDigitPhone" name="phone"
         pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
  <button type="submit">Submit</button>
</form>

</body>
</html>
