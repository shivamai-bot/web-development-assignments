<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation 8</title>
</head>

<body>
    <form>
        <label for="patternPassword">Password:</label>
        <input type="password" id="patternPassword" name="password" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
            title="Use 8+ characters, at least one uppercase letter and one number" required>
        <button type="submit">Submit</button>
    </form>

</body>

</html>
