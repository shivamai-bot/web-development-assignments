<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <form id="registrationForm">
        <label for="regName">Full Name:</label>
        <input type="text" id="regName" name="name" required minlength="2">
        <label for="regEmail">Email:</label>
        <input type="email" id="regEmail" name="email" required>
        <label for="regPassword">Password:</label>
        <input type="password" id="regPassword" name="password" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
            title="At least 8 characters, one uppercase letter and one number" required>
        <label for="regConfirm">Confirm Password:</label>
        <input type="password" id="regConfirm" required>
        <fieldset>
            <legend>Gender</legend>
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
        </fieldset>
        <label for="regCountry">Country:</label>
        <select id="regCountry" name="country" required>
            <option value="">Select country</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
        </select>
        <button type="submit">Register</button>
    </form>
    <script>
        const form = document.getElementById("registrationForm");
        const pass = document.getElementById("regPassword");
        const confirmPass = document.getElementById("regConfirm");
        form.addEventListener("submit", event => {
            if (pass.value !== confirmPass.value) {
                event.preventDefault();
                confirmPass.setCustomValidity("Passwords do not match.");
                confirmPass.reportValidity();
            } else {
                confirmPass.setCustomValidity("");
            }
        });
        confirmPass.addEventListener("input", () => confirmPass.setCustomValidity(""));
    </script>

</body>

</html>
