<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disabled <Input></Input></title>
</head>

<body>
    <form>
        <label for="accountId">Account ID (disabled):</label>
        <input type="text" id="accountId" value="USR-1001" disabled>
        <label for="displayName">Display Name (read-only):</label>
        <input type="text" id="displayName" value="Bixer" readonly>
    </form>

</body>

</html>
