<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Restriction</title>
</head>

<body>
    <form>
        <label for="restrictedAge">Age (18-60):</label>
        <input type="number" id="restrictedAge" name="age" min="18" max="60" required>
        <button type="submit">Submit</button>
    </form>

</body>

</html>
