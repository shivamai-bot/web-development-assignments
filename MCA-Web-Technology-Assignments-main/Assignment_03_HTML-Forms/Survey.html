<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey </title>
</head>

<body>
    <form action="/survey" method="post">
        <label for="surveyName">Name:</label>
        <input type="text" id="surveyName" name="name" required>
        <p>Are you satisfied?</p>
        <label><input type="radio" name="satisfaction" value="Yes" required> Yes</label>
        <label><input type="radio" name="satisfaction" value="No"> No</label>
        <p>Which topics interest you?</p>
        <label><input type="checkbox" name="topics" value="HTML"> HTML</label>
        <label><input type="checkbox" name="topics" value="CSS"> CSS</label>
        <label><input type="checkbox" name="topics" value="JavaScript"> JavaScript</label>
        <label for="frequency">How often do you practise?</label>
        <select id="frequency" name="frequency">
            <option>Daily</option>
            <option>Weekly</option>
            <option>Rarely</option>
        </select>
        <label for="surveyComments">Suggestions:</label>
        <textarea id="surveyComments" name="comments" rows="4"></textarea>
        <button type="submit">Submit Survey</button>
    </form>

</body>

</html>
