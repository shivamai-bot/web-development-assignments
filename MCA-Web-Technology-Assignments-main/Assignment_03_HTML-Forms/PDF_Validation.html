<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Validation</title>
</head>

<body>
    <form>
        <label for="pdfFile">Upload PDF:</label>
        <input type="file" id="pdfFile" name="document" accept=".pdf,application/pdf">
    </form>

</body>

</html>
